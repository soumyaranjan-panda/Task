# Study Hub — Postgres for saved solutions, plus the app itself.
#
#   docker compose up --build
#
# The named volume keeps every solution across restarts and `docker compose down`.
# Override any value in a `.env` file next to this one (see .env.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studyhub}
      POSTGRES_DB: ${POSTGRES_DB:-studyhub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed so you can inspect it with psql; not needed by the app.
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studyhub} -d ${POSTGRES_DB:-studyhub}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        # Don't start until Postgres accepts connections: the API creates its
        # schema on boot and would otherwise log a connection error.
        condition: service_healthy
    environment:
      DATABASE_URL: >-
        postgres://${POSTGRES_USER:-studyhub}:${POSTGRES_PASSWORD:-studyhub}@db:5432/${POSTGRES_DB:-studyhub}
      PORT: 8080
      API_PORT: 8090
    ports:
      - "${WEB_PORT:-8084}:8080"

volumes:
  pgdata: